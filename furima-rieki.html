<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>フリマ・せどり 利益計算ツール｜副業の確定申告かんたん計算</title><meta name="description" content="メルカリ・ラクマ・Yahoo!フリマ・ヤフオク・Amazonの販売手数料と送料、仕入値を引いた利益と利益率を計算する無料ツール。">
<link rel="canonical" href="https://kakutei-sheet.github.io/furima-rieki.html"><link rel="stylesheet" href="style.css"></head><body>
<header><a href="index.html">副業の確定申告かんたん計算</a></header>
<main>

<h1>フリマ・せどり 利益計算ツール</h1>
<div class="card">
<div class="row"><div><label for="sell">販売価格</label><input id="sell" inputmode="numeric" value="5000"></div>
<div><label for="cost">仕入値</label><input id="cost" inputmode="numeric" value="2000"></div></div>
<div class="row"><div><label for="ship">送料</label><input id="ship" inputmode="numeric" value="450"></div>
<div><label for="other">その他（梱包材など）</label><input id="other" inputmode="numeric" value="50"></div></div>
<label>販売先ごとの比較 <small>（手数料率は変更できます）</small></label>
<table id="cmp" class="tight"></table>
</div>
<p class="sub">手数料率は2026年時点の各社の基本料率の目安です（キャンペーン・会員特典・カテゴリで変わります）。最新の料率は各サービスでご確認ください。</p>
<h2>確定申告で忘れがちなこと</h2>
<p>せどりの利益は「売れた分の仕入値」だけが経費です。年末に売れ残った在庫は棚卸として翌年に回すため、仕入れた額をそのまま経費にはできません。</p>
<a class="cta" data-shop="sedori" href="#">棚卸も自動計算する せどり・物販シートを見る</a>
<script>
const P=[["メルカリ",10],["ラクマ",10],["Yahoo!フリマ",5],["ヤフオク",10],["Amazon（目安）",15]];
window.addEventListener("load",()=>{
 const t=document.getElementById("cmp");
 t.innerHTML="<tr><th>販売先</th><th>手数料率</th><th>利益</th><th>利益率</th></tr>"+P.map((p,i)=>`<tr><td>${p[0]}</td><td><input id="r${i}" inputmode="decimal" value="${p[1]}" style="width:3.6em;padding:4px 4px"></td><td id="p${i}"></td><td id="q${i}"></td></tr>`).join("");
 bind(["sell","cost","ship","other",...P.map((_,i)=>"r"+i)],()=>{const s=num("sell");P.forEach((_,i)=>{const pr=s-Math.floor(s*num("r"+i)/100)-num("ship")-num("other")-num("cost");const e=document.getElementById("p"+i);e.textContent=yen(pr);e.style.color=pr<0?"#DC2626":"";document.getElementById("q"+i).textContent=pct(pr/s);});});
});
</script>
</main>
<footer>計算結果は目安です。税務上の判断は税務署・税理士にご確認ください。入力した数字はこの端末の中だけで計算し、どこにも送信しません。<br><a href="index.html">ツール一覧へ戻る</a></footer>
<script src="common.js"></script>
</body></html>
