<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>配達員の実質時給 計算ツール｜副業の確定申告かんたん計算</title><meta name="description" content="Uber Eats・出前館・Woltなどフードデリバリー配達員の、ガソリン代や車両費を引いた本当の時給を計算する無料ツール。">
<link rel="canonical" href="https://kakutei-sheet.github.io/haitatsu-jikyu.html"><link rel="stylesheet" href="style.css"></head><body>
<header><a href="index.html">副業の確定申告かんたん計算</a></header>
<main>

<h1>配達員の実質時給 計算ツール</h1>
<div class="card">
<div class="row"><div><label for="pay">報酬（チップ込み）</label><input id="pay" inputmode="numeric" value="12000"></div>
<div><label for="hrs">稼働時間（オンライン時間）</label><input id="hrs" inputmode="decimal" value="8"></div></div>
<div class="row"><div><label for="km">走行距離（km）</label><input id="km" inputmode="decimal" value="60"></div>
<div><label for="cpk">1kmあたりの費用（円）</label><input id="cpk" inputmode="decimal" value="8"><small>原付の燃料＋消耗で5〜10円が目安</small></div></div>
<label for="fix">その他の経費（この期間ぶん）</label><input id="fix" inputmode="numeric" value="500">
<div class="result">見かけの時給：<b id="a">-</b><br>経費を引いた実質時給：<b id="b">-</b><br><small id="c"></small></div>
</div>
<h2>実質時給を上げるには</h2>
<p>時給は「サービス」「曜日」「時間帯」で大きく変わります。記録をつけて、稼げる組み合わせに稼働を寄せるのが近道です。</p>
<a class="cta" data-shop="delivery" href="#">サービス別・曜日別の時給がわかる 配達員向けシート</a>
<script>window.addEventListener("load",()=>bind(["pay","hrs","km","cpk","fix"],()=>{const h=num("hrs")||1,c=num("km")*num("cpk")+num("fix");document.getElementById("a").textContent=yen(num("pay")/h);document.getElementById("b").textContent=yen((num("pay")-c)/h);document.getElementById("c").textContent=`経費 ${yen(c)}（報酬の${pct(c/(num("pay")||1))}）`;}));</script>
</main>
<footer>計算結果は目安です。税務上の判断は税務署・税理士にご確認ください。入力した数字はこの端末の中だけで計算し、どこにも送信しません。<br><a href="index.html">ツール一覧へ戻る</a></footer>
<script src="common.js"></script>
</body></html>
